[package]
name = "agent-manager"
version = "0.1.0"
edition = "2021"
authors = ["Aëlis <aelis@constellation.anarea>"]
description = "Moteur de workflow universel pour la constellation Anaréa"
license = "MIT"
repository = "https://github.com/anarea/constellation-router"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
rusqlite = { version = "0.30", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
